openapi: "3.0.3"
info:
  title: API Администрирования
  version: "1.0"
servers:
  - url: http://127.0.0.1/api

components:
  schemas:
    Bucket:
      type: object
      properties:
        bucket_id:
          type: integer
          description: ID бакета
        bucket_name:
          type: string
          description: Имя бакета

    ListBuckets:
      type: object
      properties:
        buckets:
          type: array
          $ref: "#/components/schemas/Bucket"
          description: Список бакетов

    FileDownload:
      type: object
      properties:
        file_id:
          type: string
          description: ID файла
        file_name:
          type: string
          description: Имя файла
        file_size:
          type: integer
          description: Размер файла

    FileUpload:
      type: object
      properties:
        binarydata:
          type: string
          description: Данные файла
        bucket_id:
          type: integer
          description: ID бакета для загрузки

    FileCreatedResponse:
      type: object
      properties:
        file_id:
          type: string
        file_hash:
          type: string
          description: "MD5 хэш-сумма объекта"
        file_size:
          type: integer
          description: Размер загруженного файла

    FileDelete:
      type: object
      properties:
        file_id:
          type: string
          description: ID файла
        bucket_id:
          type: string
          description: ID бакета

    Node:
      type: object
      properties:
        id: 
          type: integer
          description: ID узла
        ip:
          type: string
          description: IP адрес узла хранения
        port:
          type: integer
          description: Порт для подключения
  
    ListNodes:
      type: object
      properties:
        nodes:
          type: array
          $ref: "#/components/schemas/Node"
          description: Список узлов хранения

    NodeMetrics:
      type: object
      properties:
        cpu_usage:
          type: number
          format: float
          description: Использование ЦП
          example: 3
        memory_usage:
          type: number
          format: float
          description: Использование ОЗУ
          example: 10.5
        disk_usage_gb:
          type: number
          format: float
          description: Использование диска для хранения в ГБ
          example: 512
        disk_total_gb:
          type: number
          format: float
          description: Общий объем диска в ГБ
          example: 1000

    NodeStatus:
      type: object
      properties:
        online:
          type: boolean
          description: Доступность узла
          example: true
        metrics:
          type: object
          $ref: "#/components/schemas/NodeMetrics"


paths:
  /bucket:
    get:
      summary: Получить список бакетов
      tags:
        - Бакеты
      responses:
        "200":
          description: список бакетов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBuckets"

    post:
      summary: Создать бакет
      tags:
        - Бакеты
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                bucket_name:
                  type: string
                  description: Название бакета
      responses:
        "200":
          description: бакет создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"

  /bucket/{bucket_id}:
    delete:
      summary: Удалить бакет
      tags:
        - Бакеты
      parameters:
        - name: bucket_id
          in: path
          description: ID бакета
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: бакет удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID удаленного бакета
        "404":
          description: бакет не найден

  
  /node:
    get:
      summary: Получить список узлов хранения
      tags:
        - Узлы хранения
      responses:
          "200":
            description: список бакетов
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ListNodes"
    post:
      summary: Добавить узел хранения
      tags:
        - Узлы хранения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                ip: 
                  type: string
                  description: IP адрес узла
                port:
                  type: integer
                  description: Порт для подключения
      responses:
        "200":
          description: бакет создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
        "422":
          description: Узел с таким IP:port уже добавлен
    
  /node/{node_id}:
    delete:
      summary: Удалить узел хранения
      tags:
        - Узлы хранения
      parameters:
        - name: node_id
          in: path
          description: ID узла
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Узел удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID удаленного узла
        "404":
          description: узел не найден
  
  /node/{node_id}/status:
    get:
      summary: Получить информацию об узле хранения
      tags:
        - Узлы хранения
      parameters:
        - name: node_id
          in: path
          description: ID узла
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: Узел удален
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/NodeStatus"
        "404":
          description: узел не найден
