openapi: 3.1.0
info:
  title: API загрузки файла
  version: 0.1.0
servers:
- url: /api

paths:
  /file/{bucket_id}:
    get:
      summary: Получить список файлов в корзине
      tags:
        - Файлы
      parameters:
        - name: bucket_id
          in: path
          description: ID бакета
          schema:
            type: integer
          required: true
      responses:
        "200":
          description: список файлов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDownload"

    post:
      summary: Загрузить файл
      tags:
        - Файлы
      parameters:
        - name: bucket_id
          in: path
          description: ID бакета
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              properties:
                binarydata:
                  type: string
                  description: Данные файла
      responses:
        "201":
          description: Файл успешно загружен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCreatedResponse"

  /file/{file_id}:
    delete:
      summary: Удалить файл
      tags:
        - Файлы
      parameters:
        - name: bucket_id
          in: path
          description: ID бакета
          schema:
            type: integer
          required: true
        - name: file_id
          in: path
          description: ID файла для удаления
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Файл удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: ID удаленного файла
        "404":
          description: Файл не найден


  /bucket:
    get:
      summary: Получить список корзин
      tags:
        - Корзины
      responses:
        "200":
          description: список корзин
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBuckets"

components:
  schemas:
    FileDownload:
      type: object
      properties:
        file_id:
          type: string
          description: ID файла
        file_name:
          type: string
          description: Имя файла
        file_size:
          type: integer
          description: Размер файла

    FileUpload:
      type: object
      properties:
        binarydata:
          type: string
          description: Данные файла
        bucket_id:
          type: integer
          description: ID бакета для загрузки

    FileCreatedResponse:
      type: object
      properties:
        filename:
          type: string
        bucket_id:
          type: integer
        chunks:
          type: integer
        nodes:
          type: array
        status:
          type: string

    Bucket:
      type: object
      properties:
        bucket_id:
          type: integer
          description: ID бакета
        bucket_name:
          type: string
          description: Имя бакета

    ListBuckets:
      type: object
      properties:
        buckets:
          type: array
          $ref: "#/components/schemas/Bucket"
          description: Список бакетов

    Body_upload_file_file__bucket_id__post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_file__bucket_id__post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
